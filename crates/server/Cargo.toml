[package]
name = "kriegsspiel-server"
version = "0.1.0"
description = "Authoritative Kriegsspiel game server, embeddable as a library"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
